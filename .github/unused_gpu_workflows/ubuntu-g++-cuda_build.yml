name: Ubuntu-g++

on:
  push:
    # paths-ignore: ['docs/**', 'wiki/**', '**/*.md', '**/*.markdown', '**/*.rst', 'Makefile_old', '.gitattributes', '.gitignore', 'AUTHORS', 'LICENSE', 'implementations/**']
    branches: [main, tests]
  pull_request:
    # paths-ignore: ['docs/**', 'wiki/**', '**/*.md', '**/*.markdown', '**/*.rst', 'Makefile_old', '.gitattributes', '.gitignore', 'AUTHORS', 'LICENSE', 'implementations/**']
    branches: [ main, tests ]
  # Run workflow on the 1st and 15th of every month at 7:33 AM PST (UTC-8)
  schedule:
    - cron: '33 15 1,15 * *'

jobs:
  phoebus_compile_and_build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # This forces GitHub to automatically pull down parthenon, singularity-eos, and kokkos
          submodules: recursive

      - uses: Jimver/cuda-toolkit@master
        id: cuda-toolkit

      - name: Verify nvcc installation
        run: nvcc --version

      - name: Set global architecture overrides for nvcc_wrapper
        run: |
          echo "NVCC_WRAPPER_DEFAULT_ARCH=sm_80" >> $GITHUB_ENV
        shell: bash

      - name: Setup OS and compile
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'g++'
          uses_mpi: "false"
      - name: Compile and build Phoebus - cuda
        uses: ./.github/actions/compile_and_build_phoebus/cuda
        with:
          compiler: 'g++'        
