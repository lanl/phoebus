name: MPI Build
run-name: Ubuntu-g++ mpi build

on:
  push:
    branches: [main]
  pull_request:
    branches: [ main ]
  # Run workflow on the 1st and 15th of every month at 12:30 AM PST (UTC-8)
  schedule:
    - cron: '30 12 1,15 * *'

jobs:
  phoebus_compile_and_build:
    name: Ubuntu-g++ mpi build
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # This forces GitHub to automatically pull down parthenon, singularity-eos, and kokkos
          submodules: recursive
      - name: Setup OS and compile
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'g++'
          uses_mpi: "true"
      - name: Compile and build Phoebus - mpi
        uses: ./.github/actions/compile_and_build_phoebus/mpi
        with:
          compiler: 'g++'